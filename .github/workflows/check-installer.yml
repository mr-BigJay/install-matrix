name: Validate installer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n install.sh
      - name: Check dangerous mistakes
        run: |
          test -f README.md
          grep -q 'set -Eeuo pipefail' install.sh
          grep -q 'umask 077' install.sh
          grep -q 'PasswordAuthentication' README.md || true
      - name: ShellCheck errors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --severity=error install.sh
